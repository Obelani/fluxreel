<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Acesso restrito — FluxReel</title>
<link rel="icon" href="/logo-icon.webp" type="image/webp" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #080B18; color: #f5f5f7; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { width: 100%; max-width: 360px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 13px; color: #9a9aa5; margin: 14px 0 6px; }
  input { width: 100%; height: 46px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #fff; padding: 0 14px; font-size: 16px; }
  input:focus { outline: none; border-color: #4F6BFF; }
  button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(90deg, #4F6BFF, #20D9FF); }
  button:disabled { opacity: .6; cursor: default; }
  .err { display: none; margin-top: 14px; font-size: 13px; color: #ff8a8a; text-align: center; }
  .err.show { display: block; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Acesso restrito</h1>
  <label for="u">Usuário</label>
  <input id="u" name="username" type="email" autocomplete="username" required autocapitalize="none" />
  <label for="p">Senha</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required />
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e"></div>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script>
(async function () {
  var client = getSupabaseClient();
  var s = client && (await client.auth.getSession()).data.session;
  if (s) { window.location.replace('/admin'); return; }
  var f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    e.classList.remove('show');
    b.disabled = true; b.textContent = 'Entrando…';
    var r = await signInWithEmail(document.getElementById('u').value.trim().toLowerCase(), document.getElementById('p').value);
    if (r.error) {
      e.textContent = 'Usuário ou senha incorretos.';
      e.classList.add('show');
      b.disabled = false; b.textContent = 'Entrar';
      return;
    }
    window.location.replace('/admin');
  });
})();
</script>
</body>
</html>
