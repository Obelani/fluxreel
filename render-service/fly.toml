# Config do Fly.io pro serviço de renderização. `auto_stop_machines` +
# `min_machines_running = 0` são o motivo principal de termos escolhido o
# Fly.io: a máquina liga sozinha quando chega um pedido de render e
# desliga sozinha depois — sem cobrança enquanto está parada.
app = "fluxreel-render"
primary_region = "gru"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
